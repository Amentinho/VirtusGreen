services:
  - type: web
    name: virtusgreen
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/contact
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreply@virtusgreen.com
      - key: APP_URL
        value: https://virtusgreen.com
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: SEPOLIA_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        value: "0x4Db52a82F5c068Cc2b11Be5009191D149315C355"
      - key: CERTIFIER_API_KEY
        sync: false
