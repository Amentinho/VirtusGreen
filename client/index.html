    <!-- ── Schema.org: FAQPage (AI search optimised) ────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is VirtusGreen and what does it do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VirtusGreen is a regulatory compliance and digital traceability platform for European GI (Geographical Indication) food producers. It uses Copernicus satellite imagery and blockchain technology to generate machine-readable evidence that products like Bronte DOP pistachios, Etna DOC wine, or Modica IGP chocolate meet EU origin and authenticity requirements."
          }
        },
        {
          "@type": "Question",
          "name": "How does VirtusGreen verify food authenticity?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VirtusGreen runs a four-layer verification: (1) NDVI vegetation index from Copernicus Sentinel-2 satellite confirms the crop was actually grown; (2) zone boundary check confirms the plot is inside the protected GI area; (3) phenology model matches the satellite signal to the crop's seasonal pattern; (4) plausibility score compares against multi-year baselines. Results are anchored immutably on Base blockchain."
          }
        },
        {
          "@type": "Question",
          "name": "Does VirtusGreen support EUDR 2023/1115 compliance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VirtusGreen supports the geolocation and cultivation proof layers of EUDR compliance — the data most SME producers currently lack. The platform records farm coordinates, NDVI cultivation evidence, and supply chain provenance. A full Due Diligence Statement export module is on the roadmap for Q4 2026, ahead of the December 2026 SME deadline."
          }
        },
        {
          "@type": "Question",
          "name": "Which EU regulations does VirtusGreen address?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VirtusGreen addresses four EU regulations: (1) GI Regulation 2024/1143 — digital plot registry and batch-level traceability; (2) EUDR 2023/1115 — deforestation-free evidence for cocoa and other commodities; (3) Wine Labelling Regulation 2021/2117 — QR e-label compliant Digital Product Passports; (4) ESPR 2024/1781 — DPP-aligned architecture for future food mandates."
          }
        },
        {
          "@type": "Question",
          "name": "What is a Digital Product Passport (DPP) for food?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Digital Product Passport is a machine-readable record linked to a QR code on food packaging. It contains verified information about where the product was grown, how it was processed, and its environmental credentials. VirtusGreen generates per-batch DPPs anchored on blockchain, compliant with EU wine e-label requirements already in force since December 2023."
          }
        },
        {
          "@type": "Question",
          "name": "Which GI products does VirtusGreen support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VirtusGreen currently supports three Sicilian GI zones: Pistacchio di Bronte DOP (pistachio, Etna northwest slope), Etna DOC (wine, volcano terroir), and Cioccolato di Modica IGP (transformation-origin chocolate with EUDR cocoa supply chain tracking). The cadastral database covers 400,000+ land parcels across Catania and Ragusa provinces."
          }
        }
      ]
